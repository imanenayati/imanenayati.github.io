<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JSON Tasks - Part 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; line-height: 1.4; }
    .nav a { margin-right: 12px; }
    .panel { border: 1px solid #ddd; border-radius: 12px; padding: 14px; max-width: 720px; }
    label { display: inline-block; min-width: 70px; }
    select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #bbb; }
    button { cursor: pointer; }
    ul { margin-top: 14px; }
    .error { color: #b00020; }
    .hint { color: #555; }
  </style>

  <!-- jQuery required for $.get -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
</head>
<body>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="json1.html">Part 1</a>
    <a href="json2.html">Part 2</a>
  </div>

  <h1>Part 3: Filter Songs by Genre</h1>

  <div class="panel">
    <form id="filterForm">
      <div>
        <label for="genreSelect"><strong>Genre</strong></label>
        <select id="genreSelect" aria-label="Genre select"></select>
        <button id="filterBtn" type="submit">Filter</button>
      </div>
      <p class="hint">The genre list is built dynamically from <code>songs.json</code> (not hard-coded).</p>
    </form>

    <div id="results"></div>
  </div>

  <script>
    let songsData = null; // store in a variable as in json2.html

    $.get("songs.json", function (data) {
      songsData = data;

      const songs = (songsData && songsData.songs) ? songsData.songs : [];
      if (!Array.isArray(songs) || songs.length === 0) {
        document.getElementById("results").innerHTML = "<p class='error'>No songs found in songs.json.</p>";
        return;
      }

      // Build a unique list of genres from the JSON data (NOT hard-coded)
      const genreSet = new Set();
      for (const song of songs) {
        if (Array.isArray(song.genres)) {
          for (const g of song.genres) genreSet.add(g);
        }
      }

      const genres = Array.from(genreSet).sort((a, b) => a.localeCompare(b));
      const select = document.getElementById("genreSelect");

      // Populate <select> dynamically
      select.innerHTML = genres.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");

      // Default display
      document.getElementById("results").innerHTML =
        "<p class='hint'>Choose a genre and click Filter to see matching song titles.</p>";

    }, "json").fail(function () {
      document.getElementById("results").innerHTML =
        "<p class='error'>Failed to load songs.json.</p>";
    });

    // Filter button behavior: display ONLY titles of matching songs
    document.getElementById("filterForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const resultsDiv = document.getElementById("results");
      if (!songsData || !Array.isArray(songsData.songs)) {
        resultsDiv.innerHTML = "<p class='error'>Songs data not loaded yet.</p>";
        return;
      }

      const selectedGenre = document.getElementById("genreSelect").value;
      const matching = songsData.songs.filter(s =>
        Array.isArray(s.genres) && s.genres.includes(selectedGenre)
      );

      if (matching.length === 0) {
        resultsDiv.innerHTML = `<p>No songs found for genre: <strong>${escapeHtml(selectedGenre)}</strong></p>`;
        return;
      }

      // Only titles (no artist/year/genre output)
      const listItems = matching.map(s => `<li>${escapeHtml(s.title)}</li>`).join("");
      resultsDiv.innerHTML = `<ul>${listItems}</ul>`;
    });

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
